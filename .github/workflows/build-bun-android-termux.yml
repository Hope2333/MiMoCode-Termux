# Build patched Bun for Android (android-termux branch)
# Workflow:
#   1. Check out Hope2333/bun android-termux branch
#   2. Verify patches apply cleanly
#   3. Install build deps (Zig, LLVM)
#   4. Cross-compile bun for aarch64-linux-android
#   5. Upload patched binary as artifact
#
# NOTE: Building bun from source requires significant resources.
# Expected runtime: ~45-60 minutes.
# The official Buildkite pipeline is the primary build path;
# this workflow serves as a verification/secondary pipeline.

name: Build Bun android-termux

on:
  workflow_dispatch:
    inputs:
      bun_ref:
        description: "Bun fork branch to build"
        required: false
        default: "android-termux"
      bun_version:
        description: "Version string (e.g. 1.3.14)"
        required: false
        default: "1.3.14"

env:
  BUN_REPO: "Hope2333/bun"
  ZIG_VERSION: "0.13.0"
  NDK_VERSION: "r27c"

jobs:
  verify-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BUN_REPO }}
          ref: ${{ github.event.inputs.bun_ref || 'android-termux' }}
          fetch-depth: 0

      - name: Verify patches
        run: |
          set -euo pipefail
          echo "=== Branch state ==="
          git log --oneline -5
          echo "=== Diff count against main ==="
          git diff --stat main..HEAD 2>/dev/null || echo "(no main ref)"
          echo "=== Verifying run_command.zig has CWD fix ==="
          grep -q 'isAndroid' src/runtime/cli/run_command.zig && echo "OK: run_command.zig patched"
          echo "=== Verifying build_command.zig has CWD fix ==="
          grep -q 'isAndroid' src/runtime/cli/build_command.zig && echo "OK: build_command.zig patched"
          echo "=== All patches verified ==="

  build-bun-x86_64:
    needs: verify-patches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BUN_REPO }}
          ref: ${{ github.event.inputs.bun_ref || 'android-termux' }}
          submodules: recursive
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential git curl cmake ninja-build \
            llvm-dev libclang-dev lld \
            pkg-config libssl-dev \
            python3 python3-pip \
            file unzip xz-utils

      - name: Install Zig
        run: |
          curl -fsSL "https://ziglang.org/download/${{ env.ZIG_VERSION }}/zig-linux-x86_64-${{ env.ZIG_VERSION }}.tar.xz" \
            -o /tmp/zig.tar.xz
          sudo tar xf /tmp/zig.tar.xz -C /usr/local --strip-components=1
          zig version

      - name: Setup WebKit
        run: |
          # WebKit is usually a submodule; verify it's fetched
          if [[ -d "webkit" && -f "webkit/Source/CMakeLists.txt" ]]; then
            echo "WebKit submodule present"
          else
            echo "WebKit not found - build will fail" >&2
            exit 1
          fi

      - name: Build Bun for x86_64 (self-host)
        run: |
          # Build bun for the HOST architecture first
          # This produces a patched bun that can run on the CI runner
          mkdir -p build
          zig build -Dtarget=x86_64-linux-gnu -Drelease-fast \
            --prefix build/out 2>&1 | tail -20
          ls -la build/out/bin/

      - name: Verify patched bun build works
        run: |
          ./build/out/bin/bun --version
          # Test that build --compile works
          echo 'console.log("hello from patched bun");' > /tmp/test.js
          ./build/out/bin/bun build --compile /tmp/test.js \
            --outfile /tmp/test-compiled 2>&1
          file /tmp/test-compiled
          /tmp/test-compiled 2>&1

      - name: Cross-compile for Android aarch64
        run: |
          # Requires Android NDK for the C/C++ components
          # Zig handles the Zig code cross-compile natively
          echo "=== Cross-compile for aarch64-linux-android ==="
          echo "Note: This requires Android NDK for sysroot"
          echo "Skipping full cross-compile in this workflow"
          echo "See .buildkite/ for official build pipeline"

      - name: Upload patched x86_64 bun
        uses: actions/upload-artifact@v4
        with:
          name: bun-android-termux-x86_64
          path: build/out/bin/
          retention-days: 7

  verify-compiled-output:
    needs: build-bun-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bun-android-termux-x86_64
          path: /tmp/bun-bin

      - name: Test bun build --compile for Android
        run: |
          chmod +x /tmp/bun-bin/bun
          /tmp/bun-bin/bun --version
          echo 'console.log("Hello from compiled Android app!");' > /tmp/app.js

          # Build for Android target (downloads Android bun from npm + injects JS)
          /tmp/bun-bin/bun build --compile \
            --target=bun-linux-arm64-android \
            /tmp/app.js --outfile=/tmp/test-android-compiled 2>&1

          echo "=== Output binary analysis ==="
          file /tmp/test-android-compiled
          # Verify it contains the magic trailer
          strings /tmp/test-android-compiled | grep -q 'Bun!' && echo "OK: magic trailer present"
          # Verify it's a Bionic-linked ELF (not glibc)
          file /tmp/test-android-compiled | grep -q 'interpreter' && echo "OK: ELF with interpreter"

      - name: Upload Android-compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: android-compiled-app
          path: /tmp/test-android-compiled
          retention-days: 7
